<script>
// Every request needs the token, which only this script can read from the address,
// so it adds it to each file. This is the one inline script: its hash is in the policy.
(() => {
  const withToken = file => "/" + file + location.search;
  const sheet = document.createElement("link");
  sheet.rel = "stylesheet";
  sheet.href = withToken("page.css");
  sheet.onload = () => {
    const boot = location.pathname === "/preview" ? "preview.js" : "live.js";
    for (const file of ["vendor/three.min.js", "threads.js", "page.js", boot]) {
      const script = document.createElement("script");
      script.async = false;
      script.src = withToken(file);
      document.head.append(script);
    }
  };
  document.head.append(sheet);
})();
</script>
