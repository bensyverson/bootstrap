# How homebrew-tap's scripts/release publishes bootstrap's formula; its --help lists the keys.
# scripts/release runs it as its last step, after it has stated the version in
# version_file, tagged and pushed, so the tap's release never bumps or runs check here.
formula=bootstrap
version_file=internal/cli/version.go
version_line=var Version = "%s"
check=go vet ./... && go test ./...
bottle=yes
sign=Developer ID Application: Syverson Industries LLC (QJ3Q58XVEE)
notary_profile=woodcase-notary
